name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # 模板仓库自身的 v1/v2 等 tag 是可复用工作流的版本号，不发布示例插件
    if: github.repository != 'OneDragon-Anyone/plugin-template'
    uses: OneDragon-Anyone/plugin-template/.github/workflows/reusable-release.yml@v1
