name: Reusable Plugin Validate

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout template tools at the exact workflow commit
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .plugin-template
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Validate repository
        run: |
          python .plugin-template/scripts/generate_const.py --repo . --check
          python .plugin-template/scripts/validate_plugin.py --repo . --strict

      - name: Build and validate release asset
        id: build
        run: |
          python .plugin-template/scripts/build_zip.py --repo . --out "$RUNNER_TEMP/dist"
          python .plugin-template/scripts/validate_plugin.py --zip "$RUNNER_TEMP"/dist/*.zip
