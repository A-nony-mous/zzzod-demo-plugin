name: Validate Plugin

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository != 'OneDragon-Anyone/plugin-template'
    uses: OneDragon-Anyone/plugin-template/.github/workflows/reusable-validate.yml@v1

  # 模板仓库自身用当前提交的工具自测
  self-test:
    if: github.repository == 'OneDragon-Anyone/plugin-template'
    uses: ./.github/workflows/reusable-validate.yml
